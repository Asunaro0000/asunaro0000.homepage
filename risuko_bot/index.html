  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const isJapanese = navigator.language.startsWith('ja');
      if (!isJapanese) {
        // 最初の挨拶
        const greeting = document.querySelector(".bubble.ai");
        if (greeting) {
          greeting.innerHTML = 'Hi there! I\'m Risuko. Let\'s chat!<img src="./assets/main.jpg" >';
        }
        // 入力欄
        const msgInput = document.getElementById("msg");
        if (msgInput) msgInput.placeholder = "Chat with Risuko...";
        // 送信ボタン
        const sendBtn = document.getElementById("send-btn");
        if (sendBtn) sendBtn.textContent = "Send";
        // デバッグログ
        const debugLog = document.getElementById("debug-log");
        if (debugLog) debugLog.textContent = "Debug Log: Ready to chat";
      }
    });
  </script>

  <div id="chat-container">
    <div id="chat">
      <div class="bubble ai">やっほー！リス子だよ。お話ししよ！<img src="./assets/main.jpg" ></div>
    </div>
  </div>

  <div id="input-area">
    <input type="text" id="msg" placeholder="リス子にお話しして..." autocomplete="off">
    <button id="send-btn">送信</button>
  </div>

  <div id="debug-log">
    デバッグログ: まだ通信していません
  </div>

  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img">
