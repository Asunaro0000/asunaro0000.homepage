<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リス子デモHP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #fff5e6; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .bubble { margin-bottom: 10px; padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .ai { background: #fff; align-self: flex-start; border: 1px solid #ffcc80; }
        .user { background: #ffcc80; align-self: flex-end; }
        img { max-width: 200px; border-radius: 10px; margin-top: 5px; display: block; }
        #input-area { padding: 20px; background: #fff; display: flex; gap: 10px; border-top: 1px solid #ffcc80; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { background: #ffcc80; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        /* チャット内の画像を大きくする設定 */
        /* ライトボックス本体の設定 */
        #lightbox {
        display: none;        /* 最初は隠しておく */
        position: fixed;      /* 画面に固定 */
        z-index: 999;         /* 一番手前に表示 */
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); /* 背景を黒い半透明に */
        cursor: zoom-out;     /* カーソルを「縮小」マークに */
        align-items: center;
        justify-content: center;
        }

        /* 拡大された画像の設定 */
        #lightbox img {
        max-width: 90%;
        max-height: 90%;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        border: 3px solid white;
        }

        /* チャット内の画像をクリックできる雰囲気にする */
        .message img {
        cursor: zoom-in;      /* カーソルを「拡大」マークに */
        transition: transform 0.2s;
        }
        .message img:hover {
        transform: scale(1.02); /* 少し浮かせて「押せる感」を出す */
        }
    </style>
</head>
<body>
    <div id="chat">
        <div class="bubble ai">こんにちは！リス子だよ。何か送ってみて！</div>
    </div>
    <div id="input-area">
        <input type="text" id="msg" placeholder="リス子にお話しして...">
        <button id="send-btn">送信</button>
    </div>
<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img">
</div>
        <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzTCcgpN10qdWm83UTH0_rV21nu-DK4X1croX-UQE6avoRPdWIJ4ixyAlTtrUolCRjVIw/exec";

        async function send() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if(!text) return;

            // 1. ユーザーのメッセージを表示
            chat.innerHTML += `<div class="bubble user">${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ message: text })
                });

                const data = await res.json();

                // 2. リス子の回答バブルを作成
                const aiBubble = document.createElement('div');
                aiBubble.className = 'bubble ai';
                aiBubble.innerText = data.msg;

                // 3. 画像がある場合の処理
                if(data.imgUrl && data.imgUrl !== "画像なし") {
                    const br = document.createElement('br');
                    const img = document.createElement('img');
                    img.src = data.imgUrl;
                    
                    // ★ 画像をクリックした時の処理（ライトボックス起動）
                    img.onclick = function() {
                        const lb = document.getElementById('lightbox');
                        const lbImg = document.getElementById('lightbox-img');
                        lbImg.src = this.src; // クリックした画像のURLを拡大用にセット
                        lb.style.display = 'flex'; // 表示
                    };

                    aiBubble.appendChild(br);
                    aiBubble.appendChild(img);
                }
                
                chat.appendChild(aiBubble);

            } catch (error) {
                console.error("通信エラー:", error);
                chat.innerHTML += `<div class="bubble ai">ごめんね、エラーが起きちゃった。</div>`;
            }
            
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('send-btn').addEventListener('click', send);
        document.getElementById('msg').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
