  <script>
  (function() {
      const initLightbox = () => {
          if (!document.getElementById('lightbox-style')) {
              const style = document.createElement('style');
              style.id = 'lightbox-style';
              style.innerHTML = `
                  .lightbox-overlay {
                      display: none; position: fixed; z-index: 99999; top: 0; left: 0;
                      width: 100vw; height: 100vh; background: rgba(0,0,0,0.9);
                      cursor: zoom-out; align-items: center; justify-content: center;
                  }
                  .lightbox-overlay img { max-width: 95%; max-height: 95%; object-fit: contain; pointer-events: none; }
                  .lightbox-overlay.active { display: flex; }
              `;
              document.head.appendChild(style);
          }
          let overlay = document.querySelector('.lightbox-overlay') || document.createElement('div');
          if (!overlay.className) {
              overlay.className = 'lightbox-overlay';
              overlay.innerHTML = '<img src="">';
              document.body.appendChild(overlay);
          }
          document.addEventListener('click', (e) => {
              const img = e.target.closest('img');
              if (img && !overlay.classList.contains('active')) {
                  if (img.closest('.graph-view-container')) return; 
                  overlay.querySelector('img').src = img.src;
                  overlay.classList.add('active');
                  e.preventDefault();
              } else if (overlay.classList.contains('active')) {
                  overlay.classList.remove('active');
              }
          }, true);
      };
      if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initLightbox);
      } else {
          initLightbox();
      }
  })();
  </script>
