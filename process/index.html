    /* グループ化用のスタイル調整 */
    .group-heading {
      width: 100%;
      margin: 2.5rem 0 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #5de6ff;

      grid-column: 1 / -1; /* グリッド内で横いっぱいに広げる */
    }
    #logs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));

<body>

  <header class="nav">

    <nav>

  <main class="section">
    <h1>Process – 制作の裏側</h1>
    <p>ComfyUIを使った画像生成、画像編集ソフトを使ったレタッチ術についての技術情報を載せています。</p>
    <p>noteはアーカイブとして、最新情報はHPに乗せています。</p>
    <a href="https://note.com/lovely_rhino8940" style="font-size: 1.3em; color: #5de6ff;">
      https://note.com/lovely_rhino8940
    </a>

    <div id="logs"></div>
  </main>

  <footer>© 2025 Asunaro Works. All rights reserved.</footer>

  <script type="module">
    import { loadYAML } from '../js/util/yaml-loader.js';
    (async () => {
      const data = await loadYAML('process.yaml');
      const wrap = document.getElementById('logs');
      if (!data?.logs) return;

      // カテゴリーの定義と表示順序、およびSEOを意識した見出し
const groupDefinitions = {
        comfyui: "ComfyUI：実践的ワークフロー構築と制御について",
        editing: "画像編集：AIを補完する手描き・修正術",
        chat:    "AI対話：物語を動かすチャット体験",
        others:  "創作の思考：作品づくりの考え方"
      };

      let finalHtml = '';

      // カテゴリーごとにループしてHTMLを生成
      for (const [key, heading] of Object.entries(groupDefinitions)) {
        const filteredLogs = data.logs.filter(l => l.category === key);
        
        // 該当する記事がある場合のみ見出しとカードを表示
        if (filteredLogs.length > 0) {
          finalHtml += `<h2 class="group-heading">${heading}</h2>`;
          finalHtml += filteredLogs.map(l => `
            <article class="card">
              <div class="body">
                <h3>${l.title}</h3>
                <p>${l.summary || ''}</p>
                ${l.url ? `<p><a class="btn" href="${l.url}" target="_blank" rel="noopener">Read →</a></p>` : ''}
              </div>
            </article>`).join('');
        }
      }

      wrap.innerHTML = finalHtml;
    })();
  </script>
  <script type="module" src="../js/extensions/nav-toggle.js"></script>
</body>
</html>
