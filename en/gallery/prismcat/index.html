<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PrismCat Memory | Asunaro Works</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/header.css">
  <script src="https://asunaro0000.github.io/asunaro0000.homepage/js/extensions/google-tag.js" defer></script>
  <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="../../">Asunaro Works</a>
    <a class="go-up" href="../" title="一つ上の階へ">⏶</a>
    <nav>
      <a href="../../gallery/">Gallery</a>
      <a href="../../about/">About</a>
      <a href="../../process/">Process</a>
      <a href="../../link/">Link</a>
      <a href="../../sitemap/">Sitemap</a>
      <a href="https://www.patreon.com/Asunaro0000" style="color:#ffd54a;">Patreon: Archive Updates</a>
      <a href="https://asunaro0000.github.io/asunaro0000.homepage/gallery/prismcat/">🌐 JP</a>
    </nav>
  </header>

  <main>
    <section id="series-hero" class="section"></section>
    <section id="phases" class="cards"></section>
  </main>

  <footer>© 2025 Asunaro Works. All rights reserved.</footer>

  <script type="module">
    import { loadYAML } from '../../js/util/yaml-loader.js';

    /**
     * 【自分専用・超シンプル版】
     * YAMLに書いてある "assets/..." というパスの前に、
     * 強制的に "../../../" を付けて en フォルダを脱出させます。
     */
    function resolvePath(p) {
      if (!p) return "";
      // もしURL（http）ならそのまま、そうでなければ3つ上に戻って繋ぐ
      return p.startsWith('http') ? p : "../../../" + p.replace(/^(\.\/|\/)/, '');
    }

    (async ()=>{
      try {
        // YAMLの読み込み
        const data = await loadYAML('../../data/series/prismcat.yaml');
        const s = data.series;

        // ヒーロー画像
        const cover = s.cover || (s.phases?.[0]?.hero ?? '');
        document.getElementById('series-hero').innerHTML = `
          <div class="figure"><img src="${resolvePath(cover)}" alt=""></div>
          <h1>${s.title}</h1>
          <p class="muted">${s.description || ''}</p>
        `;

        // フェーズカード
        document.getElementById('phases').innerHTML = (s.phases || []).map(p => {
          const thumb = resolvePath(p.hero || p.background);
          return `
            <a class="card" href="./${p.id}/">
              <img src="${thumb}" alt="${p.title}" loading="lazy">
              <div class="body"><h3>${p.title}</h3><p>${p.caption || ''}</p></div>
            </a>`;
        }).join('');
      } catch (e) {
        console.error("表示エラー:", e);
      }
    })();
  </script>
</body>
</html>
