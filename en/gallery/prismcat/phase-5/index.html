<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PrismCat – Phase 5 | Asunaro Works</title>
  <link rel="stylesheet" href="../../../css/style.css"/>
  <link rel="stylesheet" href="../../../css/header.css">
  <script src="https://asunaro0000.github.io/asunaro0000.homepage/js/extensions/google-tag.js" defer></script>
  <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="../../../">Asunaro Works</a>
    <a class="go-up" href="../" title="一つ上の階へ">⏶</a>
    <nav>
      <a href="../../../gallery/">Gallery</a>
      <a href="../../../about/">About</a>
      <a href="../../../process/">Process</a>
      <a href="../../../link/">Link</a>
      <a href="../../../sitemap/">Sitemap</a>
      <a href="https://www.patreon.com/Asunaro0000" style="color:#ffd54a;">Patreon: Archive Updates</a>
      <a href="https://asunaro0000.github.io/asunaro0000.homepage/gallery/prismcat/phase-5/">🌐 JP</a>
    </nav>
  </header>

  <main class="section">
    <div id="stage" class="figure" aria-live="polite"></div>
    <div id="caption" class="caption"></div>

    <div class="toolbar" style="margin:12px 0 8px; display:flex; gap:10px;">
      <button id="playToggle" class="btn" type="button" aria-pressed="false">▶ Auto</button>
      <button id="bgmToggle"  class="btn" type="button" aria-pressed="false">♪ BGM</button>
    </div>

    <h2 style="margin:18px 0 10px">Album</h2>
    <div class="slider" id="slider">
      <button class="nav prev" type="button">‹</button>
      <div class="track" id="track" style="touch-action:pan-y;"></div>
      <button class="nav next" type="button">›</button>
      <div class="dots" id="dots" role="tablist"></div>
    </div>

    <div id="thumbs" class="thumbs" style="margin-top:8px;"></div>

    <p style="margin-top:16px">
      <a class="btn" href="../">← Back to Series</a>
    </p>
  </main>

  <footer>© 2025 Asunaro Works. All rights reserved.</footer>

  <script type="module">
    import { loadYAML } from '../../../js/util/yaml-loader.js';
    const DATA_URL = '../../../data/series/prismcat.yaml';
    const PHASE_ID = 'phase-5';

    /**
     * 【修正の肝】
     * 今いる場所が en/ の中だろうがどこだろうが、
     * 強制的に「サイトのルート」から assets を探させます。
     */
    function resolvePath(p) {
      if (!p) return "";
      if (p.startsWith('http')) return p;

      // YAMLのパスから不要な記号を消す
      const cleanPath = p.replace(/^(\.\/|\/)/, '');

      // 1. GitHub Pages (asunaro0000.github.io/asunaro0000.homepage/) の場合
      if (window.location.hostname.includes('github.io')) {
        return `/asunaro0000.homepage/${cleanPath}`;
      }

      // 2. ローカル環境 (192.168.0.3:5500) の場合
      // スラッシュから始めることで、enフォルダを無視してルート直下の assets を見に行きます。
      return `/${cleanPath}`;
    }

    const $  = (s, r=document) => r.querySelector(s);
    const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

    const el = {
      stage:   $('#stage'),
      caption: $('#caption'),
      play:    $('#playToggle'),
      bgm:     $('#bgmToggle'),
      track:   $('#track'),
      dots:    $('#dots'),
      thumbs:  $('#thumbs'),
      prev:    $('.prev'),
      next:    $('.next'),
    };

    let idx = 0, items = [], timer = null, audio = null;

    function go(n){
      if(!items.length) return;
      idx=(n+items.length)%items.length;
      el.track.style.transform=`translateX(${ -100*idx }%)`;
      
      // ステージ（メイン画面）の更新
      const current = items[idx];
      el.stage.innerHTML = `<img src="${resolvePath(current.src)}" alt="">`;
      
      $$('#dots .dot').forEach((d,k)=>d.classList.toggle('active',k===idx));
      $$('#thumbs .th').forEach((t,k)=>t.classList.toggle('active',k===idx));
    }

    function pause(){
      if(!timer) return;
      clearInterval(timer); timer=null;
      el.play.textContent='▶ Auto';
    }

    function play(){
      if(timer||items.length<=1) return;
      el.play.textContent='⏸ Auto';
      timer=setInterval(()=>go(idx+1),4000);
    }

    async function init(){
      const spec = await loadYAML(DATA_URL);
      const phases = spec?.series?.phases || [];
      const p = phases.find(x => String(x.id)===PHASE_ID);
      if(!p) return;

      el.caption.innerHTML = `<h1>${p.title}</h1><p>${p.caption}</p>`;

      items = p.album || [];
      el.track.innerHTML = items.map(i=>`
        <div class="slide">
          <img src="${resolvePath(i.src)}" alt="">
          <div class="legend"><h3>${i.title ?? ''}</h3><p>${i.text ?? ''}</p></div>
        </div>`).join('');

      el.dots.innerHTML = items.map((_,k)=>`<button class="dot" data-i="${k}"></button>`).join('');
      el.thumbs.innerHTML = items.map((i,k)=>`
        <button class="th" data-i="${k}">
          <img src="${resolvePath(i.src)}" alt="">
        </button>`).join('');

      el.prev?.addEventListener('click', ()=>{ pause(); go(idx-1); });
      el.next?.addEventListener('click', ()=>{ pause(); go(idx+1); });
      el.dots?.addEventListener('click', e=>{ const b=e.target.closest('.dot'); if(b){ pause(); go(+b.dataset.i); }});
      el.thumbs?.addEventListener('click', e=>{ const b=e.target.closest('.th'); if(b){ pause(); go(+b.dataset.i); }});

      if(p.bgm){
        audio = new Audio(resolvePath(p.bgm));
        audio.loop=true; audio.volume=0.25;
        el.bgm?.addEventListener('click', async()=>{
          if(audio.paused){ await audio.play(); el.bgm.textContent='♪ BGM: ON'; }
          else{ audio.pause(); el.bgm.textContent='♪ BGM'; }
        });
      }
      go(0);
    }

    el.play.addEventListener('click', ()=> (timer?pause():play()));
    init().catch(err=> console.error(err));
  </script>
</body>
</html>
