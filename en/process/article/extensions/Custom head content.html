<script>
(function() {
    // 1. メニューを挿入するメイン関数
    const injectCustomLayout = () => {
        // すでにメニューが存在すれば何もしない
        if (document.querySelector('.nav')) return;

        // ヘッダー要素の作成
        const header = document.createElement('header');
        header.className = 'nav';
        
        // オンライン出力の階層に関わらず、常にドメイン直下を参照するように「/」から記述
        header.innerHTML = `
            <a class="brand" href="/">Asunaro Works</a>
            <nav>
              <a href="/gallery/">Gallery</a>
              <a href="/about/">About/Contact</a>
              <a href="/process/">Process</a>
              <a href="/link/">Link</a>
              <a href="/sitemap/">Sitemap</a>
              <a href="/goods/">Goods</a>
              <a href="https://www.patreon.com/Asunaro0000" target="_blank">Patreon</a>
            </nav>`;

        // bodyの最上部に挿入
        document.body.prepend(header);

        // GTM Noscriptも念のため挿入
        if (!document.querySelector('noscript iframe[src*="GTM-5SJ395RM"]')) {
            const ns = document.createElement('noscript');
            ns.innerHTML = `<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5SJ395RM" height="0" width="0" style="display:none;visibility:hidden"></iframe>`;
            document.body.prepend(ns);
        }
    };

    // 2. 実行タイミングの制御（重要：indexで反映されない問題への対策）
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        injectCustomLayout();
    } else {
        document.addEventListener('DOMContentLoaded', injectCustomLayout);
    }

    // 3. Obsidianの動的読み込みに対応（もしSPA的な挙動をしている場合）
    const observer = new MutationObserver((mutations) => {
        if (!document.querySelector('.nav')) {
            injectCustomLayout();
        }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

<style>
    /* CSSは変更なし（!importantで強制適用） */
    :root {
        --background-primary: #000000 !important;
        --background-secondary: #000000 !important;
        --text-normal: #ffffff !important;
    }
    html, body {
        background-color: #000000 !important;
    }
    .nav {
        background-color: #000000 !important;
        border-bottom: 1px solid #333333 !important;
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        position: sticky;
        top: 0;
        z-index: 9999;
    }
    .nav a { text-decoration: none !important; color: #ffffff !important; }
    .nav nav a { margin-left: 15px; }
</style>
